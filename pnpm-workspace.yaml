packages:
  - packages/*
  - apps/*
  - docs

# pnpm 12 refuses versions published less than a day ago by default. Exact pins
# already decide what we install, so the delay only blocks deliberate bumps.
minimumReleaseAge: 0

# e2e and @e2e-dev/web develop against each other; pnpm 12 would
# otherwise refuse to run recursive scripts across that cycle.
ignoreWorkspaceCycles: true

allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  keytar: false
  puppeteer: false
  sharp: false

overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'fflate@>=0.7.0 <0.7.5': 0.7.5
  'fflate@>=0.8.0 <0.8.3': 0.8.3
  'js-yaml@<3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@<3.3.18': 3.3.18
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.0.0 <7.29.1': 7.29.1
