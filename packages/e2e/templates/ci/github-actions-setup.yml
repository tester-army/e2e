# The steps `e2e init` adds to github-actions.yml before setup-node, one per
# package manager that npm's runner image does not already have.
pnpm:
  - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
bun:
  - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
# Yarn 2 and later come from the packageManager field through corepack; the runner image has only Yarn 1.
yarn:
  - run: corepack enable
