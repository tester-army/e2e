# What a change has to touch before a suite can see it. Read by
# dorny/paths-filter in the `changes` job of benchmark.yml, mobile.yml, and
# docs.yml, which skip their suites when nothing here changed. Each workflow's
# `gate` job is the ruleset's required check and passes over a skipped job; a
# workflow-level `paths:` filter would leave the gate pending and block the
# merge.
#
# The suites run the built packages, so a runner change reaches both, an
# engine change one. A package's own tests never reach a benchmark: `dist` is
# built from `src/` only. Every list includes this file and its workflow, so a
# change to the gate runs what it gates.
runner: &runner
  - 'packages/e2e/**'
  - '!packages/*/tests/**'
  - '!**/*.md'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
  - 'tsconfig.base.json'
  - 'scripts/**'
  - '.github/filters.yml'

web:
  - *runner
  - 'packages/web/**'
  - 'packages/github/**'
  - 'apps/web-benchmark/**'
  - '.github/workflows/benchmark.yml'

mobile:
  - *runner
  - 'packages/mobile/**'
  - 'packages/github/**'
  - 'apps/mobile-benchmark/**'
  - '.github/workflows/mobile.yml'
  - '.github/actions/expo-app/**'

docs:
  - 'docs/**'
  - 'skills/e2e/**'
  - 'scripts/check-docs-*.ts'
  - 'pnpm-lock.yaml'
  - '.github/filters.yml'
  - '.github/workflows/docs.yml'
