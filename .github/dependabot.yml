version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
    # apps/mobile-benchmark tracks Expo SDK 57; these move together by hand with `npx expo install --fix`.
    ignore:
      - dependency-name: expo
      - dependency-name: 'expo-*'
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@stripe/stripe-react-native'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
