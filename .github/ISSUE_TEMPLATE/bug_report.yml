name: Bug report
description: Something the runner, an engine, or the CLI does that it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Questions and help requests go to [Discord](https://tester.army/discord), not here.

        Security problems go to [SECURITY.md](https://github.com/tester-army/e2e/blob/main/SECURITY.md), not here.

        **A reproduction is required.** Bug reports without a link to a public repository or sandbox that shows the bug are closed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected. Paste the error code if there was one (`POLICY_DENIED`, `MODEL_UNAVAILABLE`, ...).
    validations:
      required: true
  - type: input
    id: repro
    attributes:
      label: Reproduction
      description: Link to a public repository (or StackBlitz/CodeSandbox) with the smallest app, `e2e.config.ts`, and test that show the bug. Deterministic (`screen`, `web`, `expect`) if at all possible; if an `agent.act` step is needed, say which model.
      placeholder: https://github.com/you/e2e-repro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands to run in that repository, and what you expected to see.
      placeholder: |
        1. npm install
        2. npx e2e run tests/login.e2e.ts
        3. Expected the login step to pass, it fails with ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `npx e2e --version`, plus the engine package version and Node version.
      placeholder: "e2e 0.15.1, @e2e-dev/web 0.11.1, node 26.1"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - "@e2e-dev/web"
        - "@e2e-dev/mobile"
        - custom engine
        - not engine specific
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Report excerpt, `--debug` step table, `--ai-trace` findings from `unbox-ai`. Redact anything you would not paste in public.
