name: Feature request
description: A change to the SDK, config, CLI, engine contract, or report.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Questions and help requests go to [Discord](https://tester.army/discord), not here.

        **A concrete API and its tradeoffs are required.** Requests without a proposed API, upsides, and downsides are closed.

        Want to build it yourself? Wait for a maintainer to agree on the approach here before opening a PR. See [CONTRIBUTING.md](https://github.com/tester-army/e2e/blob/main/CONTRIBUTING.md#pull-requests).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to test and where the current API stops you. A test file that does not compile or cannot be written is the best form.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How the test file or config would look with the change. Sketch the types if it touches `e2e` exports.
      render: ts
    validations:
      required: true
  - type: textarea
    id: upsides
    attributes:
      label: Upsides
      description: What the change makes possible or easier, and for whom.
    validations:
      required: true
  - type: textarea
    id: downsides
    attributes:
      label: Downsides
      description: What it costs. New API surface, breaking changes, maintenance, performance, overlap with existing features. "None" is not an answer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to get there, including what you do today, and why the proposal beats them.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      multiple: true
      options:
        - public types (SDK)
        - config keys
        - CLI flags
        - engine contract (`e2e/engine`)
        - report or cache format
        - docs only
  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This changes or removes something that exists today (see the stability policy in CONTRIBUTING.md).
