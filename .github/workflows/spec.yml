name: spec

on:
  pull_request:
  push:
    branches: [main]

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Dead code (fallow)
        run: pnpm check:dead-code
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Error code reference
        run: pnpm docs:check-errors
      - name: Peer ranges on the runner
        run: pnpm check:peer-ranges
      - name: Agent skill scripts
        run: |
          pnpm exec tsc -p .claude/skills/babysit/scripts
          node --test .claude/skills/babysit/scripts/pr-status.test.ts
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright install chromium --with-deps
      - name: Testbed
        run: pnpm --filter @e2e-dev/testbed test
      # The run's evidence pack, uploaded alone so the hosted viewer opens it
      # straight from this run (it reads an Actions artifact holding one .evidence
      # file); the link goes to the job summary, which a fork's read-only token can
      # still write.
      - name: Upload evidence
        id: evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-testbed
          path: apps/testbed/.e2e/evidence/*.evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Link the evidence
        if: ${{ !cancelled() && steps.evidence.outputs.artifact-url != '' }}
        continue-on-error: true
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          link="https://evidence.lambdatest.com/?pack=$(node -e 'process.stdout.write(encodeURIComponent(process.env.ARTIFACT_URL))')"
          echo "[Open the testbed run in the evidence viewer]($link)" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright install chromium --with-deps
      - name: Unit and integration tests
        run: pnpm test
