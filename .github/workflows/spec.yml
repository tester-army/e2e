name: spec

# The ruleset requires `spec gate` alone, so a job added here gates merges
# once it is listed in the gate's `needs`.
on:
  workflow_call:
    inputs:
      agent-device-version:
        description: Exact driver version for compatibility runs
        type: string
        default: ''
  pull_request:
  merge_group:
  push:
    branches: [main]

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'
  # The ubuntu-2404 runners restrict unprivileged user namespaces, so
  # Chromium cannot start with its sandbox on; the web engine defaults to
  # sandboxed launches, and CI opts out explicitly rather than failing at
  # browser launch.
  E2E_CHROMIUM_SANDBOX: '0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-spec-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch and the merge base, for the testbed's --changed-since.
          fetch-depth: 0
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: ./.github/actions/workspace-install
        with:
          agent-device-version: ${{ inputs.agent-device-version }}
      - name: Full nightly check
        if: ${{ inputs.agent-device-version != '' }}
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Dead code (fallow)
        run: pnpm check:dead-code
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Error code reference
        run: pnpm docs:check-errors
      - name: Peer ranges on the runner
        run: pnpm check:peer-ranges
      - name: Changeset bumps on 0.x packages
        run: pnpm check:changeset-bumps
      - name: Examples registry (examples/examples.json)
        run: pnpm check:examples
      - name: No install scripts in published dependency trees
        run: pnpm check:install-scripts
      - name: Plugin package matches its sources
        run: pnpm plugins:check
      - name: MCP Registry entry matches the runner
        run: pnpm mcp-server:check
      # The registry rejects an invalid entry only at publish, from a release
      # tag that can no longer change.
      - uses: ./.github/actions/mcp-publisher
      - name: MCP Registry accepts the entry
        run: '"$RUNNER_TEMP/mcp-publisher" validate packages/e2e/server.json'
      - name: Agent skill scripts
        run: |
          pnpm exec tsc -p .dev/skills/babysit/scripts
          node --test .dev/skills/babysit/scripts/pr-status.test.ts
      - name: Install browsers
        uses: ./.github/actions/chromium
      # On a pull request, Jev leaves out the tests the change can't affect;
      # a push to main passes no --changed-since and runs every test.
      # Without the key (a fork's pull request), every test runs.
      - name: Testbed
        run: pnpm --filter @e2e-dev/testbed test ${{ github.event_name == 'pull_request' && format('--changed-since origin/{0} --exclude-tag playwright', github.base_ref) || '' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # `scroll_to` by text under a scripted executor; the default suite's
      # arguments would not reach it, so it is a step of its own.
      - name: Testbed, scroll_to
        run: pnpm --filter @e2e-dev/testbed test:scroll
      # The tests ported from Playwright pin the web engine's behavior, so a
      # pull request runs all of them, not only the ones Jev picks.
      - name: Testbed, Playwright tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm --filter @e2e-dev/testbed exec e2e run --tag playwright

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The newest release of each line, and the floors in engines.node.
        node: [22, 24, 26, 22.22.3, 24.8.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # A major alone resolves to the runner's cached release, which can
          # sit below the patch floor in engines.node (22.22.3).
          check-latest: true
          cache: pnpm
      - uses: ./.github/actions/workspace-install
        with:
          agent-device-version: ${{ inputs.agent-device-version }}
      - name: Install browsers
        uses: ./.github/actions/chromium
        with:
          only-shell: false
      - name: Unit and integration tests
        run: pnpm test

  # The built CLI on Bun with no Node.js on its PATH
  # (packages/e2e/tests/integration/bun-runtime.test.ts): the floor
  # runtime.ts names, and the newest release. Vitest itself runs on Node.js.
  bun:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.3, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - uses: ./.github/actions/workspace-install
        with:
          agent-device-version: ${{ inputs.agent-device-version }}
      - run: pnpm --filter e2e run build
      - name: The CLI on Bun ${{ matrix.bun }}
        run: pnpm --filter e2e exec vitest run tests/integration/bun-runtime.test.ts
        env:
          # Requires Bun rather than skipping without it.
          E2E_BUN: bun

  # A new user's first install of the packed packages, which pnpm 11 and
  # later fail on any dependency build script (scripts/install-smoke.ts).
  install:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pnpm: [11, 12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: ./.github/actions/workspace-install
        with:
          agent-device-version: ${{ inputs.agent-device-version }}
      - run: pnpm run build
      - name: Fresh install with pnpm ${{ matrix.pnpm }}
        env:
          AGENT_DEVICE_VERSION: ${{ inputs.agent-device-version }}
        run: node scripts/install-smoke.ts ${{ matrix.pnpm }}

  # The one check the ruleset requires from this workflow. A skipped job
  # passes (the change cannot reach it); a failed or cancelled one fails it.
  gate:
    name: spec gate
    needs: [check, test, bun, install]
    if: ${{ always() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) \(.value.result)"] | join(", ")' <<< "$RESULTS")"
          [ -z "$failed" ] || { echo "::error::$failed"; exit 1; }
