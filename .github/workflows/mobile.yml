name: mobile

# The mobile benchmark on an iOS simulator and an Android emulator, on every
# pull request that can reach it (the `changes` job says which): the second
# real engine the runner ships, gated the way the web engine is by the
# testbed and the web benchmark.
#
# The Expo app is the expensive part (about twenty minutes of native build on
# iOS). .github/actions/expo-app builds it once per native fingerprint and
# otherwise refreshes the cached build's JS bundle, so only a native change
# rebuilds.
#
# One job per platform and suite. Each runs `e2e run` for its target on the
# booted device and, when a test fails, runs the failed tests once more with
# `--last-failed` before the job goes red (agent-device's runtime has episodes
# of its own on a shared machine, #502). The agentic suite replays the
# recordings committed under .e2e/cache, read-only in CI, and calls the model
# for a step with none, so it runs for this repository's branches only, and
# not for Dependabot's, whose runs get no secrets either. Both platforms'
# entries are recorded on a Mac (an iPhone 17 Pro simulator, a 1080x2400
# emulator) and committed with the scenario change.
#
# A job uploads its report from every run, and its artifacts (screens,
# traces, video) only when it fails: the quota is shared with every workflow
# here, and the report alone says what the first attempt of a flaky test met.
#
# Each job posts its run to the pull request as one comment through
# @e2e-dev/github (hence pull-requests: write), named `ios`, `ios agent`,
# `android`, or `android agent` by E2E_MOBILE_BENCHMARK_COMMENT, the way
# benchmark.yml names the web ones. The second pass over the failed tests
# updates the same comment: the reporter folds the rerun into the first
# pass, so a test the rerun recovered reads as flaky and the comment says
# what the job's status says.
#
# The four suite jobs are written out rather than generated by a matrix, and
# share their steps through YAML anchors (`&ios-steps`, `&android-steps`),
# with each job's SUITE variable standing in for the matrix value. A matrix
# job the gate skips reports under its unexpanded template name, so the
# ruleset's required checks (`ios deterministic`, `ios agentic`, and the two
# android ones) would never arrive and the pull request would wait forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The repository's own runs are not usage: the CLI sends no telemetry from CI here.
  E2E_TELEMETRY_DISABLED: '1'
  # A pull request from a fork runs with no secrets and a read-only token, as
  # GitHub grants on `pull_request`: the agentic suite is skipped there and
  # shared caches are restore-only. Never switch this workflow to
  # `pull_request_target` to get the key onto fork branches: that hands the
  # secret to untrusted code.
  SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Dependabot's pull requests come from this repository but run with
  # Dependabot's secrets, which hold no model key: the agentic suite would
  # fail every step without a recording. It runs for everyone else's.
  AGENTIC: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

permissions:
  contents: read
  # The suites post their comments; the `changes` job reads the pull request's files.
  pull-requests: write
  # The Expo app action deletes a cached build its repack step proved broken.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the suites when the change reaches neither the runner, the engine,
  # nor the benchmark app (.github/filters.yml says what does, and why a skip
  # rather than a workflow-level `paths:` filter). The gate fails toward
  # running: a manual dispatch runs the suites, and so does a run whose
  # detection failed.
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      mobile: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mobile == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A pull request's files come from the API; a push to main is diffed
      # against the commit before it, which the action fetches itself.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  # One job per suite, each on its own Mac with two simulators: the
  # deterministic suite and the agentic one take about as long as each other,
  # so the gate's wall time is one of them, not their sum.
  ios-deterministic:
    name: ios deterministic
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 60
    env:
      SUITE: deterministic
    defaults:
      run:
        working-directory: apps/mobile-benchmark
    steps: &ios-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build
        run: pnpm run build
        working-directory: .
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
      # `--device generic` builds for the simulator without booting one;
      # Release embeds the bundle, so no Metro is needed at run time.
      - name: Expo app
        id: app
        uses: ./.github/actions/expo-app
        with:
          platform: ios
          app-glob: '*.app'
          build-command: pnpm exec expo run:ios --configuration Release --device generic --no-bundler --output .build/ios
      # agent-device compiles its XCUITest runner on first use; keep it between runs.
      - name: Restore the agent-device runner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.agent-device
          key: agent-device-${{ runner.os }}-${{ hashFiles('packages/mobile/package.json') }}
      # `bootstatus -b` boots a device when it is not up yet and waits for it.
      # Two simulators, the picked one and a clone of it, so the run drives
      # two workers (e2e.config.ts reads the comma-separated UDIDs). The
      # runtime is pinned: the accessibility bridge reports control state
      # differently from one iOS release to the next (on 26.2 a selected tab
      # or radio carries no `selected`, and an empty field reports its
      # placeholder as its value), and the suites are verified on 26.5. Bump
      # IOS_RUNTIME on purpose, with a local run on that runtime first.
      - name: Boot two simulators
        env:
          IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
        run: |
          set -euo pipefail
          PICK="$(xcrun simctl list devices available -j | node -e '
            const payload = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const wanted = process.env.IOS_RUNTIME;
            const major = wanted.replace(/-\d+$/, "-");
            const rank = (runtime) => (runtime === wanted ? 0 : runtime.startsWith(major) ? 1 : 2);
            const runtimes = Object.entries(payload.devices)
              .filter(([runtime]) => runtime.includes("SimRuntime.iOS-"))
              .sort(([a], [b]) => rank(a) - rank(b) || b.localeCompare(a, undefined, { numeric: true }));
            for (const [runtime, list] of runtimes) {
              const pick = list.find((d) => d.name === "iPhone 17 Pro") ?? list.find((d) => d.name.startsWith("iPhone"));
              if (pick) { process.stdout.write(`${pick.udid} ${runtime} ${pick.name}`); process.exit(0); }
            }
            process.exit(1);
          ')"
          UDID="${PICK%% *}"
          SECOND="$(xcrun simctl clone "$UDID" "iPhone 17 Pro (2)")"
          echo "booting ${PICK#* } ($UDID) and its clone ($SECOND)"
          # Both boots start before either is waited on: one after the other
          # took about 130 s on this runner.
          xcrun simctl boot "$UDID"
          xcrun simctl boot "$SECOND"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl bootstatus "$SECOND"
          echo "E2E_MOBILE_BENCHMARK_IOS_DEVICE=$UDID,$SECOND" >> "$GITHUB_ENV"
      # A test that fails gets a second pass, alone, with the tests that
      # passed left out (`--last-failed` reads the report the first pass
      # wrote). agent-device's runtime has episodes of its own on a shared CI
      # machine (#502: a daemon replaced as unreachable mid-run, a runner that
      # overruns its watchdog), and the same tests pass on a Mac every time.
      # The agentic suite replays the committed recordings and calls the model
      # for a step with none, so it runs for this repository's branches only:
      # a fork's pull request has no key.
      - name: Run the suite
        if: ${{ env.SUITE == 'deterministic' || env.AGENTIC == 'true' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          E2E_MOBILE_BENCHMARK_IOS_APP: ${{ steps.app.outputs.app-path }}
          E2E_MOBILE_BENCHMARK_COMMENT: ios${{ env.SUITE == 'agentic' && ' agent' || '' }}
          E2E_RUN: node node_modules/e2e/dist/cli/bin.js run --target ios-simulator ${{ env.SUITE == 'agentic' && '--config e2e.agent.config.ts --artifacts .e2e/agent/artifacts' || '' }}
        run: $E2E_RUN || $E2E_RUN --last-failed
      # The artifact upload below fails whenever the repository's quota is
      # full, so the failure evidence goes into the log as well.
      - name: Failure screens
        if: ${{ failure() }}
        run: |
          find .e2e -path '*/failure/*' -name screen.txt | sort | head -n 12 | while read -r screen; do
            echo "::group::$screen"
            head -c 8000 "$screen"
            echo
            echo "::endgroup::"
          done
      # The report is small and says what the first attempt of a flaky test
      # met, so it is kept from every run; the artifacts (screens, traces,
      # video) only from a red one, since the quota is shared.
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-benchmark-ios-${{ env.SUITE }}-report
          path: |
            apps/mobile-benchmark/.e2e/report.json
            apps/mobile-benchmark/.e2e/agent/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload artifacts
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-benchmark-ios-${{ env.SUITE }}
          path: |
            apps/mobile-benchmark/.e2e/artifacts
            apps/mobile-benchmark/.e2e/agent/artifacts
          if-no-files-found: warn
          retention-days: 7

  ios-agentic:
    name: ios agentic
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 60
    env:
      SUITE: agentic
    defaults:
      run:
        working-directory: apps/mobile-benchmark
    steps: *ios-steps

  # One job per suite here too, each with its own emulator, for the same
  # reason: the gate's wall time is the longer suite, not both.
  android-deterministic:
    name: android deterministic
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    # x64 Blacksmith runners expose KVM, which the emulator needs.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      SUITE: deterministic
    steps: &android-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      # The Release APK is signed with the debug keystore the template uses;
      # repack-app ships the same keystore and signs the refreshed APK with it.
      - name: Expo app
        id: app
        uses: ./.github/actions/expo-app
        with:
          platform: android
          app-glob: benchmark.apk
          gradle-cache-read-only: ${{ env.SAME_REPO != 'true' }}
          build-command: |
            pnpm exec expo prebuild --platform android --no-install
            printf '\n%s\n' 'org.gradle.jvmargs=-Xmx4g' >> android/gradle.properties
            (cd android && ./gradlew :app:assembleRelease)
            mkdir -p .build/android
            cp android/app/build/outputs/apk/release/app-release.apk .build/android/benchmark.apk
      # The emulator lives for this step only (the action terminates it when
      # the step ends) and runs each `script` line in its own shell, so the
      # suite and its second pass over the failed tests are one line. Same
      # rerun and same fork rule as the iOS job.
      - name: Run the suite
        if: ${{ env.SUITE == 'deterministic' || env.AGENTIC == 'true' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          working-directory: apps/mobile-benchmark
          script: $E2E_RUN || $E2E_RUN --last-failed
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          E2E_MOBILE_BENCHMARK_ANDROID_APP: ${{ steps.app.outputs.app-path }}
          E2E_MOBILE_BENCHMARK_COMMENT: android${{ env.SUITE == 'agentic' && ' agent' || '' }}
          E2E_RUN: node node_modules/e2e/dist/cli/bin.js run --target android-emulator ${{ env.SUITE == 'agentic' && '--config e2e.agent.config.ts --artifacts .e2e/agent/artifacts' || '' }}
      - name: Failure screens
        if: ${{ failure() }}
        working-directory: apps/mobile-benchmark
        run: |
          find .e2e -path '*/failure/*' -name screen.txt | sort | head -n 12 | while read -r screen; do
            echo "::group::$screen"
            head -c 8000 "$screen"
            echo
            echo "::endgroup::"
          done
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-benchmark-android-${{ env.SUITE }}-report
          path: |
            apps/mobile-benchmark/.e2e/report.json
            apps/mobile-benchmark/.e2e/agent/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload artifacts
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-benchmark-android-${{ env.SUITE }}
          path: |
            apps/mobile-benchmark/.e2e/artifacts
            apps/mobile-benchmark/.e2e/agent/artifacts
          if-no-files-found: warn
          retention-days: 7

  android-agentic:
    name: android agentic
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      SUITE: agentic
    steps: *android-steps
