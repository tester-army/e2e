name: review-label

# `Ready for Human Review` vouches for one head: the babysit skill sets it once
# that head is green with every thread handled. Any later push, from the agent,
# a bot, or a human, drops it until the head is babysat again.
# pull_request_target so fork pushes get a token that can edit labels; the job
# never checks out or runs PR code.
on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

# The event's label list is a snapshot from the push, so a label added right
# after it would be missed; the job reads the live labels instead, one run at
# a time per PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  drop:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          if grep -qx 'Ready for Human Review' <<< "$labels"; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/Ready%20for%20Human%20Review" --silent
          fi
