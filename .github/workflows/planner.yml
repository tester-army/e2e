name: planner

# The explore planner eval (packages/e2e/evals/planner): what the planner does
# with a pull request's change, judged on fixtures, with a real model. It
# spends model calls, about ten cents a run, so it runs on the pull requests
# that can change the planner's input or prompt (the `changes` job says
# which), weekly against model drift, and on demand.
#
# It needs the model key, so on a pull request it runs only for branches of
# this repository and not for Dependabot's, whose runs get no secrets; a fork's
# pull request skips the job rather than passing it with nothing evaluated.
# Never switch this workflow to `pull_request_target` to get the key onto fork
# branches: that hands the secret to untrusted code.
on:
  pull_request:
  schedule:
    # Mondays 05:23 UTC, after the agent suites.
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      models:
        description: 'Gateway model ids, comma separated (default: openai/gpt-6-luna-fast)'
        required: false
        type: string

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the eval when the change reaches nothing the planner reads
  # (.github/filters.yml, `planner`). A schedule or a dispatch runs it.
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      planner: ${{ github.event_name != 'pull_request' || steps.filter.outputs.planner == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  eval:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.planner == 'true'
        && (github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      # A missing credential fails every fixture, which reads as a planner defect. Say what is actually wrong instead.
      - name: Require model credential
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::error::AI_GATEWAY_API_KEY is not set for this repository." \
              "The planner eval needs a real provider credential."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Build
        run: pnpm --filter e2e run build && pnpm --filter @e2e-dev/web run build
      - name: Planner eval
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Read through a variable, not interpolated into the script.
          MODELS_INPUT: ${{ inputs.models }}
        run: |
          if [ -n "$MODELS_INPUT" ]; then
            pnpm --filter e2e run eval:planner --models "$MODELS_INPUT"
          else
            pnpm --filter e2e run eval:planner
          fi
      # Every run's charters and judgements, for reading a red row without re-running.
      - name: Upload summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-eval
          path: packages/e2e/tests/tmp-projects/planner-eval/summary.*
          if-no-files-found: warn
          retention-days: 14
