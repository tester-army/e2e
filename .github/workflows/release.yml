name: release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Publishing an unbuildable or failing tree is worse than not publishing.
      # `spec.yml` gates the merge, but `main` can go red between that run and
      # this one, so the release re-runs the whole gate rather than trusting it.
      - name: Verify
        run: pnpm run check
      - name: Install browsers
        run: pnpm --filter @e2edev/web exec playwright install chromium --with-deps
      - name: Unit and integration tests
        run: pnpm test
      - name: Testbed
        run: pnpm --filter @e2edev/testbed test

      # Opens or updates a release PR while changesets are pending; publishes
      # once that PR is merged and no changesets remain.
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Granular npm access token with read/write on the @e2edev scope.
          # Provenance stays off until the repository is public: npm only
          # attests builds whose source it can link to.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
