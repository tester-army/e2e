name: site

# Redeploys e2e.com. The site reads docs/ from the newest `e2e@X.Y.Z` tag and
# the examples registry (examples/examples.json and the logos in
# examples/icons/) from `main` at build time. `release.yml` calls this after
# each release that published e2e, so the docs go live with the release; a
# push to `main` touching the examples registry redeploys too, so a new
# example is listed as soon as it merges. A workflow-level `paths:` filter is
# fine here: no ruleset requires this workflow. A manual dispatch redeploys
# without a change.
on:
  push:
    branches: [main]
    paths:
      - 'examples/examples.json'
      - 'examples/icons/**'
      - '.github/workflows/site.yml'
  workflow_call:
    secrets:
      VERCEL_DEPLOY_HOOK:
        required: true
  workflow_dispatch:

permissions: {}

# Queues pushes instead of cancelling a hook call that is already in flight.
# Each deploy reads the tag and `main` as they are when the build starts. A
# fixed group, since `github.workflow` names the caller under `workflow_call`.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Trigger the Vercel deploy hook
        run: |
          [ -n "$VERCEL_DEPLOY_HOOK" ] || { echo "::error::the VERCEL_DEPLOY_HOOK secret is not set"; exit 1; }
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
