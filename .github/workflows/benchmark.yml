name: benchmark

# The web benchmark is where the runner meets deliberately hard surfaces, so
# its suites gate every pull request that can reach them (the `changes` job
# says which). Each suite posts one comment through @e2e-dev/github (hence
# pull-requests: write) and edits it on rerun. The mobile benchmark has its
# own workflow, mobile.yml.
#
# A pull request from a fork runs with no secrets and a read-only token, as
# GitHub grants on `pull_request`. The deterministic suite needs neither and
# runs for everyone; its reporter then writes the job summary and says why it
# did not comment. The agentic suite needs the model key, so it runs only for
# branches of this repository, where only people with push access can put it
# to work. Never switch this workflow to `pull_request_target` to get the key
# onto fork branches: that hands the secret to untrusted code.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the suites when the change reaches neither the runner, the engine,
  # nor the benchmark app (.github/filters.yml says what does, and why a skip
  # rather than a workflow-level `paths:` filter). The gate fails toward
  # running: a manual dispatch runs the suites, and so does a run whose
  # detection failed.
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A pull request's files come from the API; a push to main is diffed
      # against the commit before it, which the action fetches itself.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Build
        run: pnpm run build
      - name: Run test
        env:
          # The reporter posts the comment with the job's token.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @e2e-dev/web-benchmark run test
      # The engine's tree against Chrome's accessibility tree and Playwright's
      # getByRole on every scenario, against the disagreements committed in
      # packages/web/tests/crosscheck/expected.txt. `test` built the app.
      - name: Cross-check the tree
        env:
          CROSSCHECK_BENCHMARK_URL: http://127.0.0.1:4280
        run: |
          pnpm --filter @e2e-dev/web-benchmark run start > /tmp/benchmark-app.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf "$CROSSCHECK_BENCHMARK_URL" > /dev/null && break; sleep 1; done
          pnpm --filter @e2e-dev/web exec vitest run --project integration tests/integration/crosscheck.test.ts
      # The comment is the result; the artifact is evidence for it. A storage
      # quota that refuses the upload must not turn a green suite red.
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-benchmark-web
          path: |
            apps/web-benchmark/.e2e/report.json
            apps/web-benchmark/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7

  # The agentic suite runs from the recordings committed under
  # apps/web-benchmark/.e2e/cache (AGENTS.md, "Committed recordings") and
  # needs the key for a step with none: a fork's pull request has no key, so
  # it is skipped rather than failed.
  web-agent:
    needs: changes
    if: >-
      ${{ !cancelled()
        && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true')
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    name: web agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      # A missing credential fails every agent step with MODEL_UNAVAILABLE,
      # which reads as a product defect. Say what is actually wrong instead.
      - name: Require model credential
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::error::AI_GATEWAY_API_KEY is not set for this repository." \
              "The agentic suite needs a real provider credential."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Build
        run: pnpm run build
      - name: Run test:agent
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # The reporter posts the comment with the job's token.
          GITHUB_TOKEN: ${{ github.token }}
        # --strict-cache: a committed recording that no longer replays fails
        # the job instead of spending model calls on every run.
        run: pnpm --filter @e2e-dev/web-benchmark run test:agent --strict-cache
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-benchmark-web-agent
          path: |
            apps/web-benchmark/.e2e/report.json
            apps/web-benchmark/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
