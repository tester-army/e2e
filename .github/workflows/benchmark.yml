name: benchmark

# The web benchmark is where the runner meets deliberately hard surfaces, so
# its suites gate every pull request. Each suite posts one comment through
# @e2edev/github (hence pull-requests: write) and edits it on rerun. The
# mobile benchmark stays by hand: hosted macOS minutes are not in budget yet.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      # One suite failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - suite: web
            id: web
            script: test
          # The agentic suite spends real model calls, cents per run.
          - suite: web agent
            id: web-agent
            script: test:agent
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2edev/playwright exec playwright install chromium --with-deps
      - name: Build
        run: pnpm run build
      - name: Run ${{ matrix.script }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # The reporter posts the comment with the job's token.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @e2edev/web-benchmark run ${{ matrix.script }}
      # The comment is the result; the artifact is evidence for it. A storage
      # quota that refuses the upload must not turn a green suite red.
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-benchmark-${{ matrix.id }}
          path: |
            packages/web-benchmark/.e2e/report.json
            packages/web-benchmark/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7

