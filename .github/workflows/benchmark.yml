name: benchmark

# The benchmark apps are where the runner meets deliberately hard surfaces,
# so their suites gate every pull request. Each suite posts one comment
# through @e2edev/github (hence pull-requests: write) and edits it on rerun.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      # One suite failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - suite: web
            id: web
            script: test
          # The agentic suite spends real model calls, cents per run.
          - suite: web agent
            id: web-agent
            script: test:agent
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2edev/playwright exec playwright install chromium --with-deps
      - name: Build
        run: pnpm run build
      - name: Run ${{ matrix.script }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # The reporter posts the comment with the job's token.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @e2edev/web-benchmark run ${{ matrix.script }}
      # The comment is the result; the artifact is evidence for it. A storage
      # quota that refuses the upload must not turn a green suite red.
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-benchmark-${{ matrix.id }}
          path: |
            packages/web-benchmark/.e2e/report.json
            packages/web-benchmark/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7

  # The simulator app is built once per change to the app itself and restored
  # from the Actions cache otherwise, so a pull request that only touches tests
  # or the runner never waits for Xcode. The key hashes exactly the inputs the
  # binary is made of; the Xcode version is in it because the toolchain is too.
  ios-app:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache key
        id: key
        run: |
          xcode=$(xcodebuild -version | head -1 | tr -d ' ')
          echo "key=mobile-benchmark-ios-${{ runner.os }}-${{ runner.arch }}-${xcode}-${{ hashFiles('packages/mobile-benchmark/src/**', 'packages/mobile-benchmark/modules/**', 'packages/mobile-benchmark/assets/**', 'packages/mobile-benchmark/app.json', 'packages/mobile-benchmark/index.ts', 'packages/mobile-benchmark/package.json', 'pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore app
        id: app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mobile-benchmark/.build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        if: steps.app.outputs.cache-hit != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.app.outputs.cache-hit != 'true'
        with:
          node-version: 26
          cache: pnpm
      - if: steps.app.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Prebuild
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: packages/mobile-benchmark
        env:
          CI: '1'
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          (cd ios && pod install)
      - name: Build
        if: steps.app.outputs.cache-hit != 'true'
        working-directory: packages/mobile-benchmark
        run: |
          set -euo pipefail
          workspace=$(ls -d ios/*.xcworkspace)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > ios/xcodebuild.log 2>&1 || { tail -200 ios/xcodebuild.log; exit 1; }
          app=$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app)
          rm -rf .build && mkdir .build
          cp -R "$app" .build/e2eBenchmark.app
      # Saved right after the build, not in a post step, so a failure later
      # in the run does not throw the build away.
      - name: Save app
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mobile-benchmark/.build
          key: ${{ steps.key.outputs.key }}
      - name: Upload build log
        if: ${{ failure() && steps.app.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-benchmark-xcodebuild-log
          path: packages/mobile-benchmark/ios/xcodebuild.log
          if-no-files-found: ignore

  ios:
    needs: ios-app
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mobile
            id: mobile
            script: test
          # The agentic suite spends real model calls and real device time.
          - suite: mobile agent
            id: mobile-agent
            script: test:agent
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Restore app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/mobile-benchmark/.build
          key: ${{ needs.ios-app.outputs.key }}
          fail-on-cache-miss: true
      # The engine drives whatever simulator is booted; the runner boots none.
      - name: Boot simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .key as $runtime
              | .value[] | select(.name == "iPhone 17 Pro") | { runtime: $runtime, udid }]
            | sort_by(.runtime) | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = null ]; then
            echo "::error::no iPhone 17 Pro simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run ${{ matrix.script }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # The engine installs the restored build once per worker.
          E2E_MOBILE_BENCHMARK_IOS_APP: ${{ github.workspace }}/packages/mobile-benchmark/.build/e2eBenchmark.app
          # The reporter posts the comment with the job's token.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @e2edev/mobile-benchmark run ${{ matrix.script }} --target ios-simulator
      # The comment is the result; the artifact is evidence for it. A storage
      # quota that refuses the upload must not turn a green suite red.
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-benchmark-${{ matrix.id }}
          path: |
            packages/mobile-benchmark/.e2e/report.json
            packages/mobile-benchmark/.e2e/artifacts
          if-no-files-found: warn
          retention-days: 7
