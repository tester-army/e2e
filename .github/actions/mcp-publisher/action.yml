name: mcp-publisher
description: >-
  Installs the pinned, checksum-verified MCP Registry publisher at
  $RUNNER_TEMP/mcp-publisher.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: v1.8.1
        SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      run: |
        curl -sSfL --retry 3 -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
          "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
        echo "$SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
        tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
